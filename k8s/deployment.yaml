apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: devops-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: flask-app

  template:
    metadata:
      labels:
        app: flask-app

    spec:
      serviceAccountName: flask-app-sa

      containers:
        - name: flask-app
          image: devops-practical-app:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000

          resources:
            requests:
              cpu: "100m"
            limits:
              cpu: "500m"